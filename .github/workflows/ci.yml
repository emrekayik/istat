name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build CLI and library
        run: |
          bun run build
          bun run build:library
          test -f dist/istat/types/index.d.ts
          node --input-type=module -e 'import { mean } from "./dist/istat/index.js"; if (mean([1, 2, 3]) !== 2) process.exit(1)'

      - name: Read VS Code extension version
        id: extension
        run: echo "version=$(node -p "require('./vscode-extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package distributables
        run: |
          mkdir -p dist/packages
          cp packages/istat/package.json dist/istat/package.json
          cp packages/istat/README.md dist/istat/README.md
          mkdir -p dist/istat/docs
          cp docs/library.md dist/istat/docs/library.md
          npm pack ./dist/istat --pack-destination ./dist/packages
          cd vscode-extension
          npx --yes @vscode/vsce package --out ../dist/packages/istat-language-support-${{ steps.extension.outputs.version }}.vsix

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: istat-packages
          path: |
            dist/packages/*
            dist/index.js
            dist/grammar.peggy
            dist/public/
            dist/docs/
          if-no-files-found: error
          retention-days: 30
